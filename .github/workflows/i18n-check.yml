name: i18n Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run i18n Scanner
        id: scanner
        run: |
          node tools/i18n-scanner/scan.js
        continue-on-error: true

      - name: Report Violations
        if: steps.scanner.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const exec = require('@actions/exec');

            // 1. Read Report
            const report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));
            const comments = [];

            // 2. Setup Base Ref
            // For pull_request events, base.ref is available
            const baseRef = context.payload.pull_request.base.ref;
            await exec.exec('git', ['fetch', 'origin', baseRef]);

            // 3. Process each violation
            for (const violation of report) {
              const file = violation.file.replace(process.cwd() + '/', '');
              
              // Get diff for this file
              let diffOutput = '';
              try {
                // diff -U0 means zero context lines, to only see changed lines
                await exec.exec('git', ['diff', '-U0', `origin/${baseRef}`, '--', file], {
                  listeners: { stdout: (data) => diffOutput += data.toString() },
                  silent: true,
                  ignoreReturnCode: true
                });
              } catch (e) { console.error('Git diff failed', e); continue; }

              // Parse changed lines from diff
              const changedLines = new Set();
              diffOutput.split('\n').forEach(line => {
                 if (line.startsWith('@@')) {
                     // Parse @@ -old,len +new,len @@
                     // We care about +new,len. The regex matches +start,len or +start
                     const match = line.match(/\+([0-9]+),?([0-9]*)/);
                     if (match) {
                         const start = parseInt(match[1]);
                         const len = match[2] ? parseInt(match[2]) : 1;
                         for (let i = 0; i < len; i++) changedLines.add(start + i);
                     }
                 }
              });

              // Add comment IF line is changed
              if (changedLines.has(violation.line)) {
                 comments.push({
                   path: file,
                   line: violation.line,
                   body: `⚠️ **i18n Missing**: ${violation.message}`
                 });
              }
            }

            // 4. Submit Review
            if (comments.length > 0) {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  event: 'REQUEST_CHANGES',
                  body: '### 🛑 i18n Verification Failed\n\nPlease address the missing internationalization attributes highlighted below.',
                  comments: comments
                });
            } else {
                console.log('Violations found, but none on changed lines.');
            }

      - name: Fail Workflow
        if: steps.scanner.outcome == 'failure'
        run: exit 1

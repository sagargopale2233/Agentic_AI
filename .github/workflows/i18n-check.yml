name: i18n Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run i18n Scanner
        id: scanner
        run: |
          node tools/i18n-scanner/scan.js
        continue-on-error: true

      - name: Report Violations
        if: steps.scanner.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            if (!fs.existsSync('i18n-report.json')) {
              console.log('i18n-report.json not found. Scanner might have crashed or found no violations but exited 1.');
              return;
            }

            const report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));

            if (report.length === 0) {
              console.log('No violations found.');
              return;
            }

            // --- STRATEGY 1: General Issue Comment (Fail-safe) ---
            let summaryBody = '### ⚠️ i18n Violations Report\n\n';
            summaryBody += `Found **${report.length}** elements missing internationalization attributes.\n\n`;
            summaryBody += '| File | Line | Issue |\n';
            summaryBody += '| --- | --- | --- |\n';

            report.forEach(v => {
               const relativeFile = v.file.replace(process.cwd() + '/', '');
               summaryBody += `| \`${relativeFile}\` | ${v.line} | ${v.message} |\n`;
            });
            
            summaryBody += '\nPlease add `i18n` attributes to these elements.';

            try {
                await github.rest.issues.createComment({
                    issue_number: context.issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: summaryBody
                });
                console.log('Successfully posted General Issue Comment.');
            } catch (err) {
                console.error('Failed to post General Issue Comment:', err);
            }

            // --- STRATEGY 2: Inline Code Review (Best Effort) ---
            const comments = [];
            
            // Setup Base Ref
            const baseRef = context.payload.pull_request.base.ref;
            try {
              cp.execSync(`git fetch origin ${baseRef}`);
            } catch (e) {
              console.error(`Fetch failed (skipping inline comments): ${e}`);
            }

            for (const violation of report) {
              const file = violation.file.replace(process.cwd() + '/', '');
              
              let diffOutput = '';
              try {
                // Run git diff using child_process
                diffOutput = cp.execSync(`git diff -U0 origin/${baseRef} -- ${file}`).toString();
              } catch (e) { continue; }

              const changedLines = new Set();
              diffOutput.split('\n').forEach(line => {
                 if (line.startsWith('@@')) {
                     const match = line.match(/\+([0-9]+),?([0-9]*)/);
                     if (match) {
                         const start = parseInt(match[1]);
                         const len = match[2] ? parseInt(match[2]) : 1;
                         for (let i = 0; i < len; i++) changedLines.add(start + i);
                     }
                 }
              });

              if (changedLines.has(violation.line)) {
                 comments.push({
                   path: file,
                   line: violation.line,
                   body: `⚠️ **i18n Missing**: ${violation.message}`
                 });
              }
            }

            if (comments.length > 0) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    event: 'REQUEST_CHANGES',
                    body: '### 🛑 i18n Verification Failed (Inline)',
                    comments: comments
                  });
                  console.log(`Successfully posted ${comments.length} inline review comments.`);
                } catch (error) {
                  console.error('Failed to post inline review comments:', error);
                }
            } else {
                console.log('No violations found on changed lines (inline comments skipped).');
            }
```

      - name: Fail Workflow
        if: steps.scanner.outcome == 'failure'
        run: exit 1

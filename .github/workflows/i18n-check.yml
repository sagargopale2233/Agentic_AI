name: i18n Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run i18n Scanner
        id: scanner
        run: |
          node tools/i18n-scanner/scan.js
        continue-on-error: true

      - name: Report Violations
        if: steps.scanner.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Get List of Changed Files in PR
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const changedFileNames = new Set(changedFiles.map(f => f.filename));

            // 2. Read Report
            const report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));
            const comments = [];

            // 3. Build Review Comments
            report.forEach(violation => {
              const file = violation.file.replace(process.cwd() + '/', ''); 
              
              // Only comment on files that successfully changed in this PR
              if (changedFileNames.has(file)) {
                 comments.push({
                   path: file,
                   line: violation.line,
                   body: `⚠️ **i18n Missing**: ${violation.message}`
                 });
              }
            });

            // 4. Submit Review
            if (comments.length > 0) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    event: 'REQUEST_CHANGES',
                    body: '### 🛑 i18n Verification Failed\n\nPlease address the missing internationalization attributes highlighted below.',
                    comments: comments
                  });
                } catch (error) {
                  console.error('Error creating review:', error);
                  // Context: API fails if a comment points to a line NOT in the diff.
                  // For this demo, it should work as the violation is on a new line.
                  core.setFailed('Failed to post review comments. Check logs.');
                }
            } else {
                console.log('Violations found, but none in the changed files (or files not matched).');
            }

      - name: Fail Workflow
        if: steps.scanner.outcome == 'failure'
        run: exit 1

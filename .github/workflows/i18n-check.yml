name: i18n Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  scan-i18n:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run i18n Scanner
        id: scanner
        run: |
          node tools/i18n-scanner/scan.js
        continue-on-error: true

      - name: Report Violations
        if: steps.scanner.outcome == 'failure' || steps.scanner.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');

            if (!fs.existsSync('i18n-report.json')) {
              console.log('i18n-report.json not found.');
              return;
            }

            const report = JSON.parse(fs.readFileSync('i18n-report.json', 'utf8'));

            // 1.1 Find Previous General Comment
            const { data: existingComments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const botCommentSignature = '### ⚠️ i18n Violations Report';
            const previousComment = existingComments.find(c => 
              c.body.includes(botCommentSignature)
            );

            // CASE: Checks Passed (No violations)
            if (report.length === 0) {
              console.log('No violations found. Cleaning up...');
              
              // Delete General Comment if it exists
              if (previousComment) {
                try {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: previousComment.id
                  });
                  console.log(`Deleted previous general comment ID: ${previousComment.id}`);
                } catch (err) {
                  console.error(`Failed to delete comment:`, err);
                }
              }

              // 1.2 Delete Inline Review Comments
              try {
                const { data: reviewComments } = await github.rest.pulls.listReviewComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  per_page: 100
                });

                const botReviewComments = reviewComments.filter(c => 
                  c.body.includes('⚠️ **i18n Missing**')
                );
                
                console.log(`Found ${botReviewComments.length} inline comments to delete.`);

                for (const comment of botReviewComments) {
                    try {
                      await github.rest.pulls.deleteReviewComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: comment.id
                      });
                    } catch (e) {
                      console.error(`Failed to delete review comment ${comment.id}:`, e);
                    }
                }
              } catch (e) { console.error('Error deleting review comments:', e); }

              // 1.3 Dismiss any lingering reviews (Containers)
              try {
                  const { data: reviews } = await github.rest.pulls.listReviews({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    per_page: 100
                  });
                  
                  const botReviewSignature = '### 🛑 i18n Verification Failed (Inline)';
                  const previousReviews = reviews.filter(r => 
                    r.body.includes(botReviewSignature) && r.state !== 'DISMISSED'
                  );

                  for (const review of previousReviews) {
                    try {
                      // 1.3.1 Update the Review Title/Body to be positive
                      await github.rest.pulls.updateReview({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.issue.number,
                        review_id: review.id,
                        body: '### ✅ i18n Issues Resolved'
                      });

                      // 1.3.2 Dismiss it
                      await github.rest.pulls.dismissReview({
                           owner: context.repo.owner,
                           repo: context.repo.repo,
                           pull_number: context.issue.number,
                           review_id: review.id,
                           message: 'All checks passed! 🎉'
                      });
                    } catch (e) { console.error(`Failed to update/dismiss review ${review.id}:`, e); }
                  }
              } catch (e) { console.error('Error cleaning up reviews:', e); }

              return; 
            }

            // CASE: Violations Found (Proceed with Reporting)

            // 1.2 Prepare New Comment Body
            let summaryBody = `${botCommentSignature}\n\n`;
            summaryBody += `Found **${report.length}** elements missing internationalization attributes.\n\n`;
            summaryBody += '| File | Line | Issue | Suggested Fix |\n';
            summaryBody += '| --- | --- | --- | --- |\n';

            report.forEach(v => {
               const relativeFile = v.file.replace(process.cwd() + '/', '');
               summaryBody += `| \`${relativeFile}\` | ${v.line} | ${v.message} | \`${v.suggestion}\` |\n`;
            });

            summaryBody += '\n**Tip**: Use the suggested `i18n` IDs or generate your own meaningful IDs.';
            summaryBody += `\n\n*Last updated: ${new Date().toISOString()}*`;

            // 1.3 Update or Create
            try {
              if (previousComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previousComment.id,
                  body: summaryBody
                });
                console.log(`Successfully updated comment ID: ${previousComment.id}`);
              } else {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: summaryBody
                });
                console.log('Successfully created new General Issue Comment.');
              }
            } catch (err) {
                console.error('Failed to post/update General Issue Comment:', err);
            }

            // 1.2 Find and Dismiss/Delete Previous Reviews (Inline Reports)
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              });

              const botReviewSignature = '### 🛑 i18n Verification Failed (Inline)';
              const previousReviews = reviews.filter(r => 
                r.body.includes(botReviewSignature) && r.state !== 'DISMISSED'
              );
              
              console.log(`Found ${previousReviews.length} previous reviews to dismiss.`);

              for (const review of previousReviews) {
                try {
                   // Try to dismiss the review to collapse it
                   await github.rest.pulls.dismissReview({
                     owner: context.repo.owner,
                     repo: context.repo.repo,
                     pull_number: context.issue.number,
                     review_id: review.id,
                     message: 'Outdated i18n report (New scan running)'
                   });
                   console.log(`Dismissed review ID: ${review.id}`);
                   
                   // Option: Delete if possible (DELETE method often requires admin/special scope)
                   // await github.request('DELETE /repos/{owner}/{repo}/pulls/{pull_number}/reviews/{review_id}', { ... })
                } catch (err) {
                   console.error(`Failed to dismiss review ${review.id}:`, err);
                }
              }
            } catch (error) {
              console.error('Error in cleaning up reviews:', error);
            }

            // --- STRATEGY 2: Inline Code Review (Best Effort) ---
            const comments = [];
            const baseRef = context.payload.pull_request.base.ref;

            // 2.1 Fetch Existing File Comments to avoid duplicates
            // We want to avoid commenting on the exact same line with the exact same message if it's already there.
            const { data: existingReviewComments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const existingCommentsMap = new Set(
              existingReviewComments.map(c => `${c.path}:${c.line}:${c.body.trim()}`)
            );

            // 2.2 Prepare GIT
            try {
              cp.execSync(`git fetch origin ${baseRef}`);
            } catch (e) {
              console.error(`Fetch failed: ${e}`);
            }

            for (const violation of report) {
              const file = violation.file.replace(process.cwd() + '/', '');
              
              let diffOutput = '';
              try {
                diffOutput = cp.execSync(`git diff -U0 origin/${baseRef} -- ${file}`).toString();
              } catch (e) { continue; }

              const changedLines = new Set();
              diffOutput.split('\n').forEach(line => {
                 if (line.startsWith('@@')) {
                     const match = line.match(/\+([0-9]+),?([0-9]*)/);
                     if (match) {
                         const start = parseInt(match[1]);
                         const len = match[2] ? parseInt(match[2]) : 1;
                         for (let i = 0; i < len; i++) changedLines.add(start + i);
                     }
                 }
              });

              if (changedLines.has(violation.line)) {
                 const body = `⚠️ **i18n Missing**: ${violation.message}\n\n**Suggested Fix**:\n\`\`\`html\n${violation.suggestion}\n\`\`\``;
                 const key = `${file}:${violation.line}:${body.trim()}`;
                 
                 // Only add if not already commented
                 if (!existingCommentsMap.has(key)) {
                    comments.push({
                      path: file,
                      line: violation.line,
                      body: body
                    });
                 }
              }
            }

            if (comments.length > 0) {
                try {
                  await github.rest.pulls.createReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    event: 'REQUEST_CHANGES',
                    body: '### 🛑 i18n Verification Failed (Inline)',
                    comments: comments
                  });
                } catch (error) {
                  console.error('Failed to post inline review comments:', error);
                }
            }

      - name: Fail Workflow
        if: steps.scanner.outcome == 'failure'
        run: exit 1

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 i18n="@@employeeListTitle">Employee List</h2> <!-- Missing i18n -->
    <button class="btn btn-primary">Add Employee</button> <!-- Missing i18n, link to create -->
  </div>
  
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th scope="col" i18n="@@idHeader">ID</th>
            <th scope="col">Name</th> <!-- Missing i18n -->
            <th scope="col" i18n="@@roleHeader">Role</th>
            <th scope="col">Department</th> <!-- Missing i18n -->
          </tr>
        </thead>
        <tbody>
          @for (emp of employees; track emp.id) {
            <tr>
              <td>{{ emp.id }}</td>
              <td>{{ emp.name }}</td>
              <td>{{ emp.role }}</td>
              <td>{{ emp.department }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

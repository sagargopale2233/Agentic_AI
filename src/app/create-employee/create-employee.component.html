<div class="d-flex justify-content-center mt-5">
  <div class="card shadow p-4" style="width: 32rem;">
    <div class="card-body">
      <h2 class="card-title mb-4" i18n="@@createEmployeeTitle">Create New Employee</h2>
      <form (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="name" class="form-label" i18n="@@labelEmployeeName">Employee Name:</label> <!-- Missing i18n -->
          <input type="text" class="form-control" id="name" name="name" [(ngModel)]="employee.name" placeholder="Enter full name" i18n-placeholder="@@namePlaceholder">
        </div>

        <div class="mb-3">
          <label for="role" class="form-label" i18n="@@roleLabel">Job Role:</label>
          <input type="text" class="form-control" id="role" name="role" [(ngModel)]="employee.role" placeholder="e.g. Developer" i18n-placeholder="@@inputPlaceholderegDeveloper"> <!-- Missing i18n-placeholder -->
        </div>

        <div class="mb-3">
          <label for="department" class="form-label" i18n="@@labelDepartment">Department:</label> <!-- Missing i18n -->
          <select class="form-select" id="department" name="department" [(ngModel)]="employee.department">
            <option value="" disabled selected i18n="@@optionSelectDepartment">Select Department</option> <!-- Missing i18n -->
            <option value="Engineering" i18n="@@optionEngineering">Engineering</option>
            <option value="HR" i18n="@@optionHR">HR</option>
            <option value="Sales" i18n="@@optionSales">Sales</option>
          </select>
        </div>

        <button type="submit" class="btn btn-success" i18n="@@submitButton">Save Record</button>
        <small class="d-block mt-2 text-muted" i18n="@@noteMandatoryFields">Fields marked with * are mandatory</small>
      </form>
    </div>
  </div>
</div>
